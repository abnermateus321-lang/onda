<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Música e rádio grátis, sem anúncio. Toca com a tela apagada.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onda">
<title>Onda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>

  <div id="mini" class="mini" hidden>
    <button class="mini-open" id="mini-open" aria-label="Abrir player">
      <img class="mini-art" id="mini-art" alt="">
      <span class="mini-meta">
        <span class="mini-title" id="mini-title"></span>
        <span class="mini-sub" id="mini-sub"></span>
      </span>
    </button>
    <button class="icon-btn" id="mini-fav" aria-label="Favoritar"></button>
    <button class="icon-btn mini-play" id="mini-play" aria-label="Tocar"></button>
    <div class="mini-progress"><div id="mini-bar"></div></div>
  </div>

  <nav class="tabbar" aria-label="Navegação">
    <button data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button data-nav="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Buscar</span></button>
    <button data-nav="radio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg><span>Rádios</span></button>
    <button data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 4l6 16"/></svg><span>Biblioteca</span></button>
  </nav>

  <section id="full" class="full" hidden aria-label="Tocando agora">
    <div class="full-bg" id="full-bg"></div>
    <div class="full-inner">
      <header class="full-head">
        <button class="icon-btn" id="full-close" aria-label="Fechar player"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="full-context" id="full-context">Tocando agora</span>
        <button class="icon-btn" id="full-queue" aria-label="Ver fila"><svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h9M19 14v7"/></svg></button>
      </header>
      <div class="full-art-wrap"><img class="full-art" id="full-art" alt=""></div>
      <div class="full-row">
        <div class="full-meta">
          <h2 id="full-title"></h2>
          <button class="link-btn" id="full-artist"></button>
        </div>
        <button class="icon-btn big" id="full-fav" aria-label="Favoritar"></button>
      </div>
      <div class="badge-row" id="full-badges"></div>
      <div class="seek" id="full-seek-wrap">
        <input type="range" id="full-seek" min="0" max="0" step="0.1" value="0" aria-label="Posição na música">
        <div class="times"><span id="full-cur">0:00</span><span id="full-dur">0:00</span></div>
      </div>
      <div class="transport">
        <button class="icon-btn" id="btn-shuffle" aria-label="Aleatório" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="icon-btn big" id="btn-prev" aria-label="Anterior"><svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="play-big" id="btn-play" aria-label="Tocar"></button>
        <button class="icon-btn big" id="btn-next" aria-label="Próxima"><svg viewBox="0 0 24 24" class="fill"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="icon-btn" id="btn-repeat" aria-label="Repetir"></button>
      </div>
      <div class="full-tools">
        <button class="chip" id="btn-timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span id="timer-label">Timer</span></button>
        <button class="chip" id="btn-outside"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Ouvir completa</span></button>
      </div>
    </div>
  </section>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grip"></div>
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<audio id="audio" preload="auto" playsinline></audio>
<script src="app.js"></script>
</body>
</html>
